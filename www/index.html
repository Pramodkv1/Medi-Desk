<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediDesk – Hospital & Pharmacy Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--sf:#fff;--tx:#12262a;--mu:#5d7377;--bd:#dde6e4;--ac:#0f7a6c;--ac2:#e3f3f0;--sb:#0e2a2e;--sbt:#a9c4c1;--rd:#c9423b;--rd2:#fbe9e7;--am:#a96a00;--am2:#fff2d9;--gn:#1d7a3e;--gn2:#e2f4e8;--sh:0 1px 2px rgba(14,42,46,.06),0 8px 24px rgba(14,42,46,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1a1c;--sf:#122528;--tx:#e6f0ee;--mu:#8fa9a6;--bd:#223c3f;--ac:#3fc0ac;--ac2:#13363a;--sb:#071416;--rd:#ff7b72;--rd2:#3a1c1b;--am:#f0b445;--am2:#3a2d10;--gn:#5fd68a;--gn2:#12301d}}
:root[data-theme=dark]{--bg:#0b1a1c;--sf:#122528;--tx:#e6f0ee;--mu:#8fa9a6;--bd:#223c3f;--ac:#3fc0ac;--ac2:#13363a;--sb:#071416;--rd:#ff7b72;--rd2:#3a1c1b;--am:#f0b445;--am2:#3a2d10;--gn:#5fd68a;--gn2:#12301d}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;height:100%}
aside{background:var(--sb);color:var(--sbt);padding:20px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:18px;padding:4px 10px 20px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--ac);display:grid;place-items:center;font-style:normal;color:#fff}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;color:inherit;cursor:pointer;text-align:left;width:100%;font-weight:500;transition:.15s}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}.nav.on{background:rgba(255,255,255,.12);color:#fff}
.nav svg{width:18px;height:18px;flex:none}.nav b{margin-left:auto;background:var(--rd);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.sp{flex:1}
main{overflow:auto;padding:28px 32px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:24px;margin:0;letter-spacing:-.02em}h2{font-size:15px;margin:0}
.sub{color:var(--mu);margin-top:2px}.grow{flex:1}
.btn{border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center;transition:.15s}
.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{filter:brightness(1.08)}
.btn.s{padding:5px 10px;font-size:12px;border-radius:8px}.btn.d{color:var(--rd)}
.btn svg{width:16px;height:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
.pad{padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:16px 18px}.stat small{color:var(--mu);font-weight:500}.stat div{font-size:28px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.stat.w div{color:var(--rd)}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:18px}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
input,select,textarea{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%}
.tools input{max-width:300px}.tools select{width:auto}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;color:var(--mu);font-weight:600;font-size:12px;padding:12px 16px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr.c{cursor:pointer}tbody tr.c:hover{background:var(--ac2)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--ac2);color:var(--ac)}
.tag.r{background:var(--rd2);color:var(--rd)}.tag.a{background:var(--am2);color:var(--am)}.tag.g{background:var(--gn2);color:var(--gn)}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac2);color:var(--ac);display:inline-grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.who{display:flex;align-items:center;gap:10px}.mu{color:var(--mu)}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.empty{padding:34px;text-align:center;color:var(--mu)}
.ov{position:fixed;inset:0;background:rgba(6,20,22,.55);display:grid;place-items:center;padding:16px;z-index:50;animation:f .15s}
.md{background:var(--sf);border-radius:16px;width:min(620px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:u .2s}
.md.l{width:min(820px,100%)}
@keyframes f{from{opacity:0}}@keyframes u{from{transform:translateY(12px);opacity:0}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.fg label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:12px;color:var(--mu)}.fg .f{grid-column:1/-1}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.slots{display:flex;flex-wrap:wrap;gap:6px}.slot{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;background:var(--sf);font-size:12px;font-weight:600}
.slot.on{background:var(--ac);color:#fff;border-color:var(--ac)}.slot:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:16px 0}.tabs button{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--mu);font-weight:600;border-bottom:2px solid transparent}.tabs button.on{color:var(--ac);border-color:var(--ac)}
video{width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover}
.scanbox{position:relative}.scanbox:after{content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--rd);box-shadow:0 0 12px var(--rd);animation:sc 2s ease-in-out infinite alternate}
@keyframes sc{from{top:25%}to{top:75%}}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--sb);color:#fff;padding:11px 18px;border-radius:12px;z-index:99;box-shadow:var(--sh);animation:u .2s}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--ac)}.bar.lo i{background:var(--rd)}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding:14px 0}
.mb{display:none}
@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:1fr auto}aside{flex-direction:row;padding:6px;order:2;overflow-x:auto;gap:2px}.logo,.sp,.thm{display:none}.nav{flex-direction:column;gap:3px;font-size:10px;padding:7px 10px;width:auto;flex:1;align-items:center}.nav b{position:absolute;margin:0;transform:translate(14px,-8px)}main{padding:18px 14px 30px}.cols{grid-template-columns:1fr}.fg{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="app"><aside id="nav"></aside><main id="v"></main></div>
<script>
const IC={dash:'M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10',appt:'M8 2v4M16 2v4M3 9h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z',pat:'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8M22 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8',inv:'M21 8l-9-5-9 5v8l9 5 9-5zM3.3 7L12 12l8.7-5M12 22V12',bill:'M4 4h16v18l-3-2-3 2-2-2-2 2-3-2-3 2zM8 9h8M8 13h8',doc:'M12 12a4 4 0 100-8 4 4 0 000 8M4 21v-1a6 6 0 016-6h4a6 6 0 016 6v1',scan:'M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 8v8M11 8v8M15 8v8M18 8v8',plus:'M12 5v14M5 12h14',moon:'M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z'};
const ic=(k)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k]}"/></svg>`;
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,7).toUpperCase();
const day=(n=0)=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const ini=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
const daysTo=d=>Math.round((new Date(d)-new Date(day()))/864e5);
const DOCS=[{n:'Dr. Anita Sharma',d:'General Medicine'},{n:'Dr. Rohan Mehta',d:'Cardiology'},{n:'Dr. Priya Nair',d:'Paediatrics'},{n:'Dr. Imran Qureshi',d:'Orthopaedics'}];
const SLOTS=['09:00','09:30','10:00','10:30','11:00','11:30','12:00','14:00','14:30','15:00','15:30','16:00','16:30'];
const seed=()=>({
 pts:[{id:'P1001',name:'Aarav Kapoor',age:34,sex:'Male',phone:'98100 11223',blood:'B+',allergy:'Penicillin',notes:'Hypertension, follow-up quarterly.',reports:[{id:'R1',test:'Lipid profile',date:day(-12),result:'LDL 148 mg/dL',flag:'High',note:'Diet review advised'},{id:'R2',test:'Complete blood count',date:day(-12),result:'Hb 14.2 g/dL',flag:'Normal',note:''}],rx:[{id:'X1',date:day(-12),text:'Amlodipine 5 mg once daily, 30 days'}]},
 {id:'P1002',name:'Meera Iyer',age:61,sex:'Female',phone:'98200 44556',blood:'O+',allergy:'None',notes:'Type 2 diabetes.',reports:[{id:'R3',test:'HbA1c',date:day(-5),result:'7.9 %',flag:'High',note:'Adjust metformin'}],rx:[{id:'X2',date:day(-5),text:'Metformin 500 mg twice daily, 60 days'}]},
 {id:'P1003',name:'Zoya Khan',age:7,sex:'Female',phone:'99100 77889',blood:'A+',allergy:'None',notes:'Routine immunisation.',reports:[],rx:[]}],
 ap:[{id:'A1',pid:'P1001',doc:0,date:day(),time:'10:00',reason:'BP follow-up',st:'Booked'},{id:'A2',pid:'P1002',doc:1,date:day(),time:'11:30',reason:'ECG review',st:'Checked in'},{id:'A3',pid:'P1003',doc:2,date:day(1),time:'09:30',reason:'Vaccination',st:'Booked'}],
 inv:[{id:'D1',code:'8901234500011',name:'Paracetamol 500 mg',cat:'Tablet',batch:'PC2309',exp:day(240),qty:420,min:100,price:2.5,rack:'A1'},
 {id:'D2',code:'8901234500028',name:'Amoxicillin 250 mg',cat:'Capsule',batch:'AM2402',exp:day(40),qty:60,min:80,price:9,rack:'A3'},
 {id:'D3',code:'8901234500035',name:'Metformin 500 mg',cat:'Tablet',batch:'MF2311',exp:day(300),qty:210,min:100,price:3.2,rack:'B2'},
 {id:'D4',code:'8901234500042',name:'Cough syrup 100 ml',cat:'Syrup',batch:'CS2305',exp:day(-8),qty:18,min:20,price:78,rack:'C1'},
 {id:'D5',code:'8901234500059',name:'Insulin glargine 3 ml',cat:'Injection',batch:'IG2401',exp:day(120),qty:12,min:15,price:640,rack:'FR1'},
 {id:'D6',code:'8901234500066',name:'Amlodipine 5 mg',cat:'Tablet',batch:'AL2310',exp:day(500),qty:330,min:100,price:4.1,rack:'B1'}],
 sales:[]});
let S;try{S=JSON.parse(localStorage.getItem('medidesk'))}catch(e){}S=S||seed();
const save=()=>{try{localStorage.setItem('medidesk',JSON.stringify(S))}catch(e){}};
let tab='dash',cart=[],q={a:'',ad:'',as:'',p:'',i:'',ic:''};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)};
const P=id=>S.pts.find(p=>p.id===id)||{name:'Unknown',id};
const stat=d=>d.qty<=0?['Out of stock','r']:daysTo(d.exp)<0?['Expired','r']:daysTo(d.exp)<=60?['Expiring soon','a']:d.qty<=d.min?['Low stock','a']:['In stock','g'];
const alerts=()=>S.inv.filter(d=>stat(d)[1]!=='g');
function modal(html,wide){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md ${wide?'l':''}" role="dialog" aria-modal="true">${html}</div>`;o.onclick=e=>{if(e.target===o)close()};const close=()=>{o.remove();o.stop&&o.stop()};document.body.append(o);o.close=close;return o}
const nav=()=>{const n=alerts().length;$('#nav').innerHTML=`<div class="logo"><i>+</i>MediDesk</div>`+[['dash','Dashboard','dash'],['appt','Appointments','appt'],['pat','Patients','pat'],['inv','Inventory','inv'],['bill','Billing','bill'],['doc','Doctors','doc']].map(([k,l,i])=>`<button class="nav ${tab===k?'on':''}" data-t="${k}">${ic(i)}${l}${k==='inv'&&n?`<b>${n}</b>`:''}</button>`).join('')+`<div class="sp"></div><button class="nav thm" id="thm">${ic('moon')}Theme</button>`;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});$('#thm').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0b1a1c';r.dataset.theme=d?'light':'dark'}};
const head=(t,s,act='')=>`<div class="top"><div><h1>${t}</h1><div class="sub">${s}</div></div><div class="grow"></div>${act}</div>`;
function render(){nav();({dash,appt,pat,inv,bill,doc})[tab]();save()}

/* Dashboard */
function dash(){const td=S.ap.filter(a=>a.date===day()&&a.st!=='Cancelled'),al=alerts(),rev=S.sales.filter(s=>s.date===day()).reduce((a,s)=>a+s.total,0);
$('#v').innerHTML=head('Good day, team','Here is what needs attention today.',`<button class="btn" id="n1">${ic('plus')}Book appointment</button><button class="btn p" id="n2">${ic('scan')}Scan medicine</button>`)+
`<div class="stats"><div class="card stat"><small>Appointments today</small><div>${td.length}</div></div><div class="card stat"><small>Registered patients</small><div>${S.pts.length}</div></div><div class="card stat ${al.length?'w':''}"><small>Stock alerts</small><div>${al.length}</div></div><div class="card stat"><small>Sales today</small><div>${money(rev)}</div></div></div>
<div class="cols"><div class="card pad"><h2>Today’s schedule</h2>${td.sort((a,b)=>a.time.localeCompare(b.time)).map(a=>`<div class="li"><b style="width:52px">${a.time}</b><div class="grow"><div>${esc(P(a.pid).name)}</div><div class="mu">${DOCS[a.doc].n} · ${esc(a.reason)}</div></div>${tg(a.st)}</div>`).join('')||'<div class="empty">No appointments today.</div>'}</div>
<div class="card pad"><h2>Stock alerts</h2>${al.map(d=>`<div class="li"><div class="grow"><div>${esc(d.name)}</div><div class="mu">Batch ${d.batch} · ${d.qty} left</div></div><span class="tag ${stat(d)[1]}">${stat(d)[0]}</span></div>`).join('')||'<div class="empty">All stock is healthy.</div>'}</div></div>`;
$('#n1').onclick=()=>bookAppt();$('#n2').onclick=()=>scanFlow()}
const tg=s=>`<span class="tag ${{Booked:'',['Checked in']:'a',Completed:'g',Cancelled:'r'}[s]}">${s}</span>`;

/* Appointments */
function appt(){let L=S.ap.filter(a=>(!q.ad||a.date===q.ad)&&(!q.as||a.st===q.as)&&(P(a.pid).name+a.reason+DOCS[a.doc].n).toLowerCase().includes(q.a.toLowerCase())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
$('#v').innerHTML=head('Appointments','Schedule visits and manage the day’s queue.',`<button class="btn p" id="nb">${ic('plus')}Book appointment</button>`)+
`<div class="tools"><input id="s" placeholder="Search patient, doctor, reason" value="${esc(q.a)}"><input type="date" id="d" value="${q.ad}" style="width:auto"><select id="st"><option value="">All statuses</option>${['Booked','Checked in','Completed','Cancelled'].map(x=>`<option ${q.as===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="card tw"><table><thead><tr><th>When</th><th>Patient</th><th>Doctor</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>${L.map(a=>`<tr><td><b>${a.time}</b><div class="mu">${a.date}</div></td><td><div class="who"><span class="av">${ini(P(a.pid).name)}</span>${esc(P(a.pid).name)}</div></td><td>${DOCS[a.doc].n}<div class="mu">${DOCS[a.doc].d}</div></td><td>${esc(a.reason)}</td><td>${tg(a.st)}</td><td style="white-space:nowrap">${a.st==='Booked'?`<button class="btn s" data-a="${a.id}" data-s="Checked in">Check in</button> `:''}${a.st==='Checked in'?`<button class="btn s" data-a="${a.id}" data-s="Completed">Complete</button> `:''}${['Booked','Checked in'].includes(a.st)?`<button class="btn s d" data-a="${a.id}" data-s="Cancelled">Cancel</button>`:''}</td></tr>`).join('')}</tbody></table>${L.length?'':'<div class="empty">No appointments match. Try clearing filters or book a new one.</div>'}</div>`;
$('#nb').onclick=()=>bookAppt();$('#s').oninput=e=>{q.a=e.target.value;appt();$('#s').focus();$('#s').setSelectionRange(99,99)};$('#d').onchange=e=>{q.ad=e.target.value;appt()};$('#st').onchange=e=>{q.as=e.target.value;appt()};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{S.ap.find(a=>a.id===b.dataset.a).st=b.dataset.s;toast(b.dataset.s);render()})}
function bookAppt(pid=''){if(!S.pts.length)return toast('Register a patient first');let sel='';const o=modal(`<h1 style="font-size:20px">Book appointment</h1><div class="fg"><label class="f">Patient<select id="bp">${S.pts.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)} (${p.id})</option>`).join('')}</select></label><label>Doctor<select id="bd">${DOCS.map((d,i)=>`<option value="${i}">${d.n} – ${d.d}</option>`).join('')}</select></label><label>Date<input type="date" id="bt" min="${day()}" value="${day()}"></label><label class="f">Time slot<div class="slots" id="sl"></div></label><label class="f">Reason for visit<input id="br" placeholder="e.g. Fever for 3 days"></label></div><div class="row"><button class="btn" id="x">Cancel</button><button class="btn p" id="ok">Confirm booking</button></div>`);
const slots=()=>{const d=+$('#bd',o).value,t=$('#bt',o).value;$('#sl',o).innerHTML=SLOTS.map(s=>{const taken=S.ap.some(a=>a.doc===d&&a.date===t&&a.time===s&&a.st!=='Cancelled');return`<button class="slot ${sel===s?'on':''}" data-s="${s}" ${taken?'disabled':''}>${s}</button>`}).join('');o.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{sel=b.dataset.s;slots()})};slots();$('#bd',o).onchange=$('#bt',o).onchange=()=>{sel='';slots()};$('#x',o).onclick=o.close;
$('#ok',o).onclick=()=>{if(!sel)return toast('Choose a time slot');S.ap.push({id:uid('A'),pid:$('#bp',o).value,doc:+$('#bd',o).value,date:$('#bt',o).value,time:sel,reason:$('#br',o).value||'Consultation',st:'Booked'});o.close();toast('Appointment booked');render()}}

/* Patients */
function pat(){const L=S.pts.filter(p=>(p.name+p.id+p.phone).toLowerCase().includes(q.p.toLowerCase()));
$('#v').innerHTML=head('Patients','Records, test reports and prescriptions in one place.',`<button class="btn p" id="np">${ic('plus')}New patient</button>`)+`<div class="tools"><input id="s" placeholder="Search name, ID or phone" value="${esc(q.p)}"></div><div class="card tw"><table><thead><tr><th>Patient</th><th>ID</th><th>Age / Sex</th><th>Phone</th><th>Allergies</th><th>Reports</th></tr></thead><tbody>${L.map(p=>`<tr class="c" data-p="${p.id}"><td><div class="who"><span class="av">${ini(p.name)}</span><b>${esc(p.name)}</b></div></td><td>${p.id}</td><td>${p.age} · ${p.sex}</td><td>${esc(p.phone)}</td><td>${p.allergy&&p.allergy!=='None'?`<span class="tag r">${esc(p.allergy)}</span>`:'<span class="mu">None</span>'}</td><td>${p.reports.length}${p.reports.some(r=>r.flag!=='Normal')?' <span class="tag a">Review</span>':''}</td></tr>`).join('')}</tbody></table>${L.length?'':'<div class="empty">No patients found.</div>'}</div>`;
$('#np').onclick=newPat;$('#s').oninput=e=>{q.p=e.target.value;pat();$('#s').focus();$('#s').setSelectionRange(99,99)};document.querySelectorAll('[data-p]').forEach(r=>r.onclick=()=>patView(r.dataset.p))}
function newPat(){const o=modal(`<h1 style="font-size:20px">Register patient</h1><div class="fg"><label class="f">Full name<input id="n"></label><label>Age<input id="a" type="number" min="0"></label><label>Sex<select id="x"><option>Female</option><option>Male</option><option>Other</option></select></label><label>Phone<input id="ph"></label><label>Blood group<select id="b">${['A+','A-','B+','B-','O+','O-','AB+','AB-'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="f">Known allergies<input id="al" placeholder="None"></label><label class="f">Medical history<textarea id="nt" rows="2"></textarea></label></div><div class="row"><button class="btn" id="c">Cancel</button><button class="btn p" id="ok">Save patient</button></div>`);$('#c',o).onclick=o.close;
$('#ok',o).onclick=()=>{const n=$('#n',o).value.trim();if(!n)return toast('Enter the patient’s name');S.pts.push({id:'P'+(1001+S.pts.length+Math.floor(Math.random()*9)),name:n,age:+$('#a',o).value||0,sex:$('#x',o).value,phone:$('#ph',o).value,blood:$('#b',o).value,allergy:$('#al',o).value||'None',notes:$('#nt',o).value,reports:[],rx:[]});o.close();toast('Patient registered');render()}}
function patView(id,t='reports'){const p=P(id),o=modal(`<div class="who"><span class="av" style="width:48px;height:48px;font-size:16px">${ini(p.name)}</span><div class="grow"><h1 style="font-size:20px">${esc(p.name)}</h1><div class="mu">${p.id} · ${p.age} yrs · ${p.sex} · Blood ${p.blood} · ${esc(p.phone)}</div></div><button class="btn p s" id="bk">Book visit</button></div>
${p.allergy!=='None'?`<p><span class="tag r">Allergy: ${esc(p.allergy)}</span></p>`:''}<p class="mu">${esc(p.notes)||'No history recorded.'}</p>
<div class="tabs">${[['reports','Test reports'],['rx','Prescriptions'],['visits','Visits']].map(([k,l])=>`<button class="${t===k?'on':''}" data-k="${k}">${l}</button>`).join('')}</div><div id="tb"></div><div class="row" style="margin-top:14px"><button class="btn" id="cl">Close</button></div>`,true);
const tb=$('#tb',o);
if(t==='reports')tb.innerHTML=`<div class="card tw"><table><thead><tr><th>Date</th><th>Test</th><th>Result</th><th>Flag</th></tr></thead><tbody>${p.reports.map(r=>`<tr><td>${r.date}</td><td>${esc(r.test)}<div class="mu">${esc(r.note)}</div></td><td>${esc(r.result)}</td><td><span class="tag ${r.flag==='Normal'?'g':'r'}">${r.flag}</span></td></tr>`).join('')}</tbody></table>${p.reports.length?'':'<div class="empty">No reports yet.</div>'}</div><div class="fg"><label>Test name<input id="rt" placeholder="e.g. Thyroid panel"></label><label>Result<input id="rr" placeholder="e.g. TSH 2.1 mIU/L"></label><label>Flag<select id="rf"><option>Normal</option><option>High</option><option>Low</option><option>Critical</option></select></label><label>Notes<input id="rn"></label></div><button class="btn p" id="ar">Add report</button>`;
if(t==='rx')tb.innerHTML=(p.rx.map(r=>`<div class="li"><b style="width:90px">${r.date}</b><div>${esc(r.text)}</div></div>`).join('')||'<div class="empty">No prescriptions yet.</div>')+`<div class="fg"><label class="f">New prescription<textarea id="rxt" rows="2" placeholder="Drug, dose, frequency, duration"></textarea></label></div><button class="btn p" id="arx">Save prescription</button>`;
if(t==='visits')tb.innerHTML=S.ap.filter(a=>a.pid===id).map(a=>`<div class="li"><b style="width:130px">${a.date} ${a.time}</b><div class="grow">${DOCS[a.doc].n}<div class="mu">${esc(a.reason)}</div></div>${tg(a.st)}</div>`).join('')||'<div class="empty">No visits yet.</div>';
o.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{o.close();patView(id,b.dataset.k)});$('#cl',o).onclick=o.close;$('#bk',o).onclick=()=>{o.close();bookAppt(id)};
const ar=$('#ar',o);if(ar)ar.onclick=()=>{const te=$('#rt',o).value.trim();if(!te)return toast('Enter a test name');p.reports.unshift({id:uid('R'),test:te,date:day(),result:$('#rr',o).value,flag:$('#rf',o).value,note:$('#rn',o).value});save();toast('Report added');o.close();patView(id,'reports');if(tab==='pat')pat()};
const ax=$('#arx',o);if(ax)ax.onclick=()=>{const x=$('#rxt',o).value.trim();if(!x)return;p.rx.unshift({id:uid('X'),date:day(),text:x});save();toast('Prescription saved');o.close();patView(id,'rx')}}

/* Inventory */
function inv(){const L=S.inv.filter(d=>(d.name+d.code+d.batch).toLowerCase().includes(q.i.toLowerCase())&&(!q.ic||d.cat===q.ic||(q.ic==='alert'&&stat(d)[1]!=='g')));
$('#v').innerHTML=head('Inventory','Every drug, batch and expiry date — added by hand or by scan.',`<button class="btn" id="ad">${ic('plus')}Add manually</button><button class="btn p" id="sc">${ic('scan')}Scan barcode</button>`)+
`<div class="tools"><input id="s" placeholder="Search name, barcode or batch" value="${esc(q.i)}"><select id="f"><option value="">All categories</option><option value="alert" ${q.ic==='alert'?'selected':''}>Needs attention</option>${['Tablet','Capsule','Syrup','Injection','Ointment','Other'].map(x=>`<option ${q.ic===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="card tw"><table><thead><tr><th>Medicine</th><th>Batch</th><th>Expiry</th><th>Stock</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>${L.map(d=>`<tr><td><b>${esc(d.name)}</b><div class="mu">${d.cat} · ${d.code||'No barcode'} · Rack ${esc(d.rack)}</div></td><td>${esc(d.batch)}</td><td>${d.exp}</td><td><b>${d.qty}</b><div class="bar ${d.qty<=d.min?'lo':''}"><i style="width:${Math.min(100,d.qty/(d.min*3)*100)}%"></i></div></td><td>${money(d.price)}</td><td><span class="tag ${stat(d)[1]}">${stat(d)[0]}</span></td><td><button class="btn s" data-e="${d.id}">Edit</button></td></tr>`).join('')}</tbody></table>${L.length?'':'<div class="empty">No medicines found. Scan a barcode or add one manually.</div>'}</div>`;
$('#ad').onclick=()=>drugForm();$('#sc').onclick=()=>scanFlow();$('#s').oninput=e=>{q.i=e.target.value;inv();$('#s').focus();$('#s').setSelectionRange(99,99)};$('#f').onchange=e=>{q.ic=e.target.value;inv()};document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>drugForm(S.inv.find(d=>d.id===b.dataset.e)))}
function drugForm(d,code=''){const n=!d;d=d||{code,name:'',cat:'Tablet',batch:'',exp:'',qty:0,min:50,price:0,rack:''};
const o=modal(`<h1 style="font-size:20px">${n?'Add medicine':'Edit medicine'}</h1><div class="fg"><label class="f">Barcode<div style="display:flex;gap:8px"><input id="c" value="${esc(d.code)}" placeholder="Scan or type"><button class="btn" id="rs" type="button">${ic('scan')}Scan</button></div></label><label class="f">Medicine name<input id="n" value="${esc(d.name)}"></label><label>Category<select id="g">${['Tablet','Capsule','Syrup','Injection','Ointment','Other'].map(x=>`<option ${d.cat===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Batch no.<input id="b" value="${esc(d.batch)}"></label><label>Expiry date<input type="date" id="e" value="${d.exp}"></label><label>Quantity<input type="number" id="q" min="0" value="${d.qty}"></label><label>Reorder level<input type="number" id="m" min="0" value="${d.min}"></label><label>Price per unit (₹)<input type="number" id="pr" step="0.01" value="${d.price}"></label><label>Rack / shelf<input id="r" value="${esc(d.rack)}"></label></div><div class="row">${n?'':'<button class="btn d" id="dl">Delete</button><span class="grow"></span>'}<button class="btn" id="x">Cancel</button><button class="btn p" id="ok">Save medicine</button></div>`);
$('#x',o).onclick=o.close;$('#rs',o).onclick=()=>scanner(c=>{$('#c',o).value=c;const ex=S.inv.find(i=>i.code===c&&i!==d);if(ex)toast('Barcode already exists: '+ex.name)});
if($('#dl',o))$('#dl',o).onclick=()=>{if(confirm('Delete this medicine?')){S.inv=S.inv.filter(i=>i!==d);o.close();render()}};
$('#ok',o).onclick=()=>{const v={code:$('#c',o).value.trim(),name:$('#n',o).value.trim(),cat:$('#g',o).value,batch:$('#b',o).value,exp:$('#e',o).value,qty:+$('#q',o).value,min:+$('#m',o).value,price:+$('#pr',o).value,rack:$('#r',o).value};if(!v.name||!v.exp)return toast('Name and expiry date are required');n?S.inv.push({id:uid('D'),...v}):Object.assign(d,v);o.close();toast('Medicine saved');render()}}
/* Scanner: camera (BarcodeDetector) + manual / USB scanner input */
function scanner(cb){let stream,raf,done=false;const o=modal(`<h1 style="font-size:20px">Scan medicine</h1><p class="mu">Point the camera at the barcode, or use a USB scanner / type the code below.</p><div class="scanbox" id="sb"><video id="vd" playsinline muted></video></div><div class="fg"><label class="f">Barcode<input id="mc" placeholder="Scan here or type, then press Enter" autofocus></label></div><div class="row"><button class="btn" id="x">Cancel</button><button class="btn p" id="go">Use code</button></div>`);
const fin=c=>{if(done||!c)return;done=true;o.close();cb(c.trim())};o.stop=()=>{done=true;cancelAnimationFrame(raf);stream&&stream.getTracks().forEach(t=>t.stop())};
$('#x',o).onclick=o.close;$('#go',o).onclick=()=>fin($('#mc',o).value);$('#mc',o).onkeydown=e=>{if(e.key==='Enter')fin(e.target.value)};
(async()=>{try{if(!('BarcodeDetector'in window)||!navigator.mediaDevices)throw 0;const det=new BarcodeDetector(),v=$('#vd',o);stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play();const loop=async()=>{if(done)return;try{const r=await det.detect(v);if(r.length)return fin(r[0].rawValue)}catch(e){}raf=requestAnimationFrame(loop)};loop()}catch(e){$('#sb',o).innerHTML='<div class="empty card">Camera scanning is not available here. Use a USB scanner or type the code.</div>'}})()}
function scanFlow(){scanner(c=>{const d=S.inv.find(i=>i.code===c);if(!d){toast('New barcode – add its details');return drugForm(null,c)}
const o=modal(`<h1 style="font-size:20px">${esc(d.name)}</h1><p class="mu">Batch ${d.batch} · Expires ${d.exp} · ${d.qty} in stock</p><div class="fg"><label class="f">Add received stock<input type="number" id="a" min="1" value="10"></label></div><div class="row"><button class="btn" id="ed">Edit details</button><button class="btn p" id="ok">Add to stock</button></div>`);$('#ed',o).onclick=()=>{o.close();drugForm(d)};$('#ok',o).onclick=()=>{d.qty+=+$('#a',o).value||0;o.close();toast('Stock updated');render()}})}

/* Billing */
function bill(){const tot=cart.reduce((a,c)=>a+c.price*c.n,0);
$('#v').innerHTML=head('Billing','Scan items to build a bill. Stock updates when you complete the sale.')+`<div class="cols"><div class="card pad"><div style="display:flex;gap:8px;margin-bottom:12px"><input id="s" list="dl" placeholder="Scan barcode or search medicine, then press Enter" autofocus><button class="btn" id="cs">${ic('scan')}</button></div><datalist id="dl">${S.inv.map(d=>`<option value="${esc(d.name)}">`).join('')}</datalist>
${cart.map((c,i)=>`<div class="li"><div class="grow"><b>${esc(c.name)}</b><div class="mu">${money(c.price)} each</div></div><input type="number" min="1" max="${c.max}" value="${c.n}" data-i="${i}" style="width:70px"><b style="width:90px;text-align:right">${money(c.price*c.n)}</b><button class="btn s d" data-r="${i}">Remove</button></div>`).join('')||'<div class="empty">The bill is empty. Scan or search a medicine to start.</div>'}</div>
<div class="card pad"><h2>Checkout</h2><div class="fg"><label class="f">Patient (optional)<select id="pp"><option value="">Walk-in customer</option>${S.pts.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label></div><div class="tot"><span>Total</span><span>${money(tot)}</span></div><button class="btn p" style="width:100%;justify-content:center" id="co" ${cart.length?'':'disabled'}>Complete sale</button>
<h2 style="margin-top:22px">Recent sales</h2>${S.sales.slice(-5).reverse().map(s=>`<div class="li"><div class="grow">${s.items} item(s)<div class="mu">${s.who}</div></div><b>${money(s.total)}</b></div>`).join('')||'<div class="empty">No sales yet.</div>'}</div></div>`;
const add=v=>{v=v.trim().toLowerCase();const d=S.inv.find(i=>i.code===v||i.name.toLowerCase()===v);if(!d)return toast('No medicine matches “'+v+'”');if(stat(d)[0]==='Expired'||d.qty<1)return toast(d.name+' is '+stat(d)[0].toLowerCase());const c=cart.find(x=>x.id===d.id);if(c){if(c.n<d.qty)c.n++}else cart.push({id:d.id,name:d.name,price:d.price,n:1,max:d.qty});bill()};
$('#s').onkeydown=e=>{if(e.key==='Enter')add(e.target.value)};$('#cs').onclick=()=>scanner(add);
document.querySelectorAll('[data-i]').forEach(i=>i.onchange=()=>{cart[+i.dataset.i].n=Math.max(1,Math.min(+i.max,+i.value||1));bill()});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.r,1);bill()});
$('#co').onclick=()=>{cart.forEach(c=>S.inv.find(d=>d.id===c.id).qty-=c.n);const p=$('#pp').value;S.sales.push({date:day(),total:tot,items:cart.reduce((a,c)=>a+c.n,0),who:p?P(p).name:'Walk-in'});cart=[];toast('Sale completed');render()}}

/* Doctors */
function doc(){$('#v').innerHTML=head('Doctors','Today’s load and next free slot.')+`<div class="stats">${DOCS.map((d,i)=>{const t=S.ap.filter(a=>a.doc===i&&a.date===day()&&a.st!=='Cancelled'),free=SLOTS.find(s=>!t.some(a=>a.time===s));return`<div class="card stat"><div class="who"><span class="av">${ini(d.n.replace('Dr. ',''))}</span><div><b>${d.n}</b><div class="mu">${d.d}</div></div></div><div>${t.length}<small> today</small></div><small>${free?'Next free: '+free:'Fully booked'}</small></div>`}).join('')}</div>`}
render();
</script></body></html>
